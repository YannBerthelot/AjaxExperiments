[tool.poetry]
name = "ajax-experiments"
version = "0.1.0"
description = "Experiment scripts, sweeps, and plotting for the Ajax RL library"
authors = ["Yann Berthelot <yannberthelot1@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
ajax = {path = "../Ajax", develop = true}
target-gym = {path = "../TargetGym", develop = true}
# Imported by the plotting and analysis scripts (plot_sweep.py caches to
# parquet through pyarrow). Ajax declared them; it stops doing so.
pandas = ">=2.1.1,<3"
pyarrow = ">=23.0.1,<24"
statsmodels = ">=0.14.6,<0.15"
matplotlib = ">=3.8.0,<4"

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.6"
mypy = "^1.10.0"
pre-commit = "^3.3.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
