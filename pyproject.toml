[tool.poetry]
name = "ajax-experiments"
version = "0.1.0"
description = "Experiment scripts, sweeps, and plotting for the Ajax RL library"
authors = ["Yann Berthelot <yannberthelot1@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
ajax = {path = "../Ajax", develop = true}

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.6"
mypy = "^1.10.0"
pre-commit = "^3.3.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
