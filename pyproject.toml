[project]
name = "ajax-experiments"
version = "0.1.0"
description = "Experiment scripts, sweeps, and plotting for the Ajax RL library"
authors = [{ name = "Yann Berthelot", email = "yannberthelot1@gmail.com" }]
# Ajax and TargetGym support Python 3.11 to 3.13.
requires-python = ">=3.11,<3.14"
dependencies = [
    # The GPU runs need CUDA, which Ajax pulls only on request (Linux only).
    "ajax[cuda]",
    "target-gym",
    # Ajax takes gymnax from the branch in [tool.uv.sources]; gymnax 1.0.0 on
    # PyPI caps gymnasium below Ajax's floor. Drop this line and its source
    # when Ajax goes back to a gymnax release.
    "gymnax",
    # Imported by the plotting and analysis scripts (plot_sweep.py caches to
    # parquet through pyarrow). Ajax declared them; it stops doing so.
    "pandas>=2.1.1,<3",
    "pyarrow>=23.0.1,<24",
    "statsmodels>=0.14.6,<0.15",
    "matplotlib>=3.8.0,<4",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0,<8",
    "ruff>=0.11.6,<0.12",
    "mypy>=1.10.0,<2",
    "pre-commit>=3.3.3,<4",
]

[tool.uv]
# Scripts, not a package: uv installs the dependencies only.
package = false

[tool.uv.sources]
ajax = { path = "../Ajax", editable = true }
target-gym = { path = "../TargetGym", editable = true }
gymnax = { git = "https://github.com/YannBerthelot/gymnax.git", branch = "chore/relax-runtime-pins" }
