[tool.poetry]
name = "ajax-experiments"
version = "0.1.0"
description = "Experiment scripts, sweeps, and plotting for the Ajax RL library"
authors = ["Yann Berthelot <yannberthelot1@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
# Ajax and TargetGym support Python 3.11 to 3.13.
python = ">=3.11,<3.14"
ajax = {path = "../Ajax", develop = true}
target-gym = {path = "../TargetGym", develop = true}
# Ajax takes gymnax from this branch through [tool.uv.sources], which Poetry
# does not read; gymnax 1.0.0 on PyPI caps gymnasium below Ajax's floor.
# Drop this line when Ajax goes back to a gymnax release.
gymnax = {git = "https://github.com/YannBerthelot/gymnax.git", branch = "chore/relax-runtime-pins"}
# Imported by the plotting and analysis scripts (plot_sweep.py caches to
# parquet through pyarrow). Ajax declared them; it stops doing so.
pandas = ">=2.1.1,<3"
pyarrow = ">=23.0.1,<24"
statsmodels = ">=0.14.6,<0.15"
matplotlib = ">=3.8.0,<4"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
ruff = "^0.11.6"
mypy = "^1.10.0"
pre-commit = "^3.3.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
